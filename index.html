    <!-- Gracefully handle Vite dev HMR WebSocket connection in AI Studio iframe environment -->
    <script>
      (function() {
        if (typeof window === 'undefined' || !window.WebSocket) return;
        var OrigWebSocket = window.WebSocket;
        function PatchedWebSocket(url, protocols) {
          var isHmr = protocols === 'vite-hmr' || 
            (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf(':24678') !== -1));
          if (isHmr) {
            var listeners = {};
            var fakeWs = {
              readyState: 1, // OPEN
              OPEN: 1,
              CONNECTING: 0,
              CLOSING: 2,
              CLOSED: 3,
              url: url,
              protocol: protocols,
              addEventListener: function(evt, cb) {
                if (!listeners[evt]) listeners[evt] = [];
                listeners[evt].push(cb);
                if (evt === 'open') {
                  setTimeout(function() {
                    try { cb({ type: 'open', target: fakeWs }); } catch (e) {}
                  }, 0);
                }
              },
              removeEventListener: function(evt, cb) {
                if (!listeners[evt]) return;
                listeners[evt] = listeners[evt].filter(function(fn) { return fn !== cb; });
              },
              dispatchEvent: function(event) {
                var cbs = listeners[event && event.type] || [];
                cbs.forEach(function(fn) { try { fn(event); } catch (e) {} });
                return true;
              },
              send: function() {},
              close: function() {
                fakeWs.readyState = 3;
                var cbs = listeners['close'] || [];
                cbs.forEach(function(fn) { try { fn({ type: 'close', target: fakeWs, code: 1000, wasClean: true }); } catch (e) {} });
              }
            };
            return fakeWs;
          }
          return new OrigWebSocket(url, protocols);
        }
        PatchedWebSocket.prototype = OrigWebSocket.prototype;
        PatchedWebSocket.OPEN = OrigWebSocket.OPEN;
        PatchedWebSocket.CONNECTING = OrigWebSocket.CONNECTING;
        PatchedWebSocket.CLOSING = OrigWebSocket.CLOSING;
        PatchedWebSocket.CLOSED = OrigWebSocket.CLOSED;
        window.WebSocket = PatchedWebSocket;

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = (reason && reason.message) || String(reason || '');
          var stack = (reason && reason.stack) || '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            stack.indexOf('@vite/client') !== -1 ||
            stack.indexOf('createWebSocketModuleRunnerTransport') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = (event && event.message) || '';
          var filename = (event && event.filename) || '';
          var stack = (event && event.error && event.error.stack) || '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            filename.indexOf('@vite/client') !== -1 ||
            stack.indexOf('createWebSocketModuleRunnerTransport') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
